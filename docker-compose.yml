version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=geopol
      - POSTGRES_PASSWORD=geopol
      - POSTGRES_DB=geopol_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./backups:/app/backups
    env_file:
      - .env
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - WEB_HOST=0.0.0.0  # This ensures proper HTTPS handling
      - POSTGRES_URL=postgresql://geopol:geopol@postgres:5432/geopol_db
    command: uvicorn src.web.main:app --host 0.0.0.0 --port 8000

  bot:
    build: .
    volumes:
      - ./backups:/app/backups
    env_file:
      - .env
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - POSTGRES_URL=postgresql://geopol:geopol@postgres:5432/geopol_db
    command: python bot.py

  feed:
    build: .
    volumes:
      - ./backups:/app/backups
    env_file:
      - .env
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - POSTGRES_URL=postgresql://geopol:geopol@postgres:5432/geopol_db
    command: python feed_service.py

volumes:
  pgdata:
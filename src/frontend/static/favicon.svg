<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D9FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0EA5E9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Dark background for intelligence theme -->
  <rect width="32" height="32" fill="#030712" rx="6"/>
  
  <!-- Satellite/monitoring icon -->
  <g fill="url(#grad)">
    <!-- Main satellite body -->
    <rect x="13" y="12" width="6" height="8" rx="1"/>
    
    <!-- Solar panels -->
    <rect x="9" y="14" width="3" height="4" rx="0.5"/>
    <rect x="20" y="14" width="3" height="4" rx="0.5"/>
    
    <!-- Antenna -->
    <circle cx="16" cy="10" r="1.5"/>
    <line x1="16" y1="8.5" x2="16" y2="6" stroke="url(#grad)" stroke-width="1"/>
    
    <!-- Signal waves -->
    <circle cx="16" cy="22" r="2" fill="none" stroke="url(#grad)" stroke-width="0.8" opacity="0.6"/>
    <circle cx="16" cy="22" r="4" fill="none" stroke="url(#grad)" stroke-width="0.6" opacity="0.4"/>
    <circle cx="16" cy="22" r="6" fill="none" stroke="url(#grad)" stroke-width="0.4" opacity="0.3"/>
  </g>
</svg> 